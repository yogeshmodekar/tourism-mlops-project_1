name: Tourism MLOps Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "tourism_project/deployment/tourism_model.joblib"
      - "tourism_project/deployment/model_metadata.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r tourism_project/requirements.txt
      - name: Validate dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r tourism_project/requirements.txt
      - name: Prepare data
        run: python tourism_project/model_building/prep.py
      - name: Upload train-test splits for next job
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: artifacts/*.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r tourism_project/requirements.txt
      - name: Download train-test split artifact
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: artifacts
      - name: Train, tune, evaluate, and save model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python tourism_project/model_building/train.py
      - name: Upload MLflow run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking
          path: mlruns/
          if-no-files-found: ignore
      - name: Commit trained model back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/tourism_model.joblib tourism_project/deployment/model_metadata.json
          if git diff --cached --quiet; then
            echo "No model changes to commit."
          else
            git commit -m "Update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi


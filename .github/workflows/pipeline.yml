
name: Tourism MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:

  register-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dataset
        run: python model_building/data_register.py


  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Data
        run: python model_building/prep.py

      - name: Upload Prepared Data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: artifacts


  model-training:
    needs: data-prep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Prepared Data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts

      - name: Train Model
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python model_building/train.py

      - name: Upload MLflow Logs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns

      - name: Upload Trained Model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            deployment/tourism_model.joblib
            deployment/model_metadata.json
